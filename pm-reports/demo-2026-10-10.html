async function unlock() {
  const pass = document.getElementById('pw').value;
  const err = document.getElementById('err');
  const btn = document.getElementById('go');
  err.textContent = '';
  if (!pass) { err.textContent = 'Please enter the passphrase.'; return; }
  btn.disabled = true;
  btn.textContent = 'Decrypting…';
  try {
    const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const keyMat = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(SALT_B64), iterations: ITERS, hash: 'SHA-256' },
      keyMat, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64(IV_B64) }, key, b64(CT_B64));
    document.getElementById('gate').style.display = 'none';
    const c = document.getElementById('content');
    c.innerHTML = new TextDecoder().decode(pt);
    c.style.display = 'block';
    document.title = 'P001 Daily Report 2026-10-10 (sample)';
  } catch (e) {
    err.textContent = 'Incorrect passphrase. Try again.';
    btn.disabled = false;
    btn.textContent = 'Unlock report';
